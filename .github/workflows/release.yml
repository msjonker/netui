name: Release

# Push a tag like v0.3.0 to build the OpenWrt packages and publish a release:
#   git tag v0.3.0 && git push origin v0.3.0
# Run it by hand (Actions tab, or `gh workflow run release.yml`) for a dry run:
# the packages are built as workflow artifacts and nothing is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for the dry run
        default: 0.0.0

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          [[ "$GITHUB_REF_TYPE" == tag ]] && v="${GITHUB_REF_NAME#v}"
          # apk and opkg both need a plain dotted version.
          [[ "$v" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
        env:
          NETUI_VERSION: ${{ steps.version.outputs.version }}
      - run: npm run check:budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  package:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # netui is PKGARCH:=all: the SDK release only picks the format.
        sdk:
          - x86-64-openwrt-25.12 # .apk, OpenWrt 25.x and snapshots
          - x86-64-openwrt-24.10 # .ipk, OpenWrt 24.10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: scripts/build-package.sh ${{ matrix.sdk }} ${{ needs.web.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.sdk }}
          path: out/${{ matrix.sdk }}/*

  release:
    needs: [web, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: packages/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          Copy the package for your OpenWrt release to the router, then:

          - OpenWrt 25.x / snapshots: \`apk add --allow-untrusted netui-${VERSION}-r1.apk\`
          - OpenWrt 24.10: \`opkg install netui_${VERSION}-r1_all.ipk\`

          Then run \`netui-passwd\` once to create the login and open \`http://<router>/netui/\`.

          To manage another OpenWrt router as an access point, install \`netui-agent\` on it,
          run \`netui-agent prepare\`, plug it into the gateway's LAN and adopt it from Devices.
          The packages are unsigned, hence \`--allow-untrusted\` for apk.
          EOF
          # A re-pushed tag (e.g. after a history rewrite) replaces the packages
          # on the existing release and keeps its notes.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" --title "netui $VERSION" --notes-file notes.md
          fi
